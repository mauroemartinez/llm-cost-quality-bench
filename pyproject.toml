[project]
name = "llm-cost-quality-bench"
version = "0.1.0"
description = "Measure the cost and the quality of LLMs on a real B2B task (handling supplier quotes) with 100% synthetic data: one big prompt versus modular agents with validation guards."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mauro E. Martinez" }]
keywords = ["llm", "benchmark", "cost", "evaluation", "pydantic", "procurement"]
dependencies = [
  "pydantic>=2.7",
  "polars>=1.0",
  "matplotlib>=3.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
